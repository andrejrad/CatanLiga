<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Nagrade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=60" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <a href="admin.html" aria-label="Back to admin page">
      <img class="logo-corner logo-clickable" src="Assets/Logo.png" alt="Catan Liga Zagreb logo" />
    </a>
    <h1 class="page-title page-title-flow">Nagrade</h1>
    <div class="page-content">
      <p class="admin-note">Dodaj novu nagradu unosom mjesta na turniru, opisa, slike i podataka o sponzoru.</p>

      <form id="awardForm" class="admin-form" novalidate>
        <label class="form-field">
          <span class="form-label">Tournament place</span>
          <input id="awardPlace" name="awardPlace" type="number" min="1" step="1" required />
        </label>

        <label class="form-field">
          <span class="form-label">Description</span>
          <textarea id="awardDescription" name="awardDescription" rows="4" maxlength="300" required></textarea>
        </label>

        <label class="form-field">
          <span class="form-label">Picture</span>
          <input id="awardImage" name="awardImage" type="file" accept="image/*" required />
          <small class="field-note">Maksimalna velicina slike je 10MB.</small>
        </label>

        <label class="form-field">
          <span class="form-label">Sponsor</span>
          <input id="awardSponsor" name="awardSponsor" type="text" maxlength="120" required />
        </label>

        <label class="form-field">
          <span class="form-label">Sponsor web link</span>
          <input id="awardSponsorWeb" name="awardSponsorWeb" type="text" maxlength="240" required placeholder="npr. https://sponsor.com" />
        </label>

        <p id="awardFormStatus" class="form-status" aria-live="polite"></p>

        <div class="page-cta-row page-cta-row-left">
          <button id="awardSubmitBtn" class="page-cta-btn" type="submit">Dodaj nagradu</button>
          <button id="awardCancelEdit" class="page-cta-btn page-cta-btn-secondary" type="button" hidden>Odustani</button>
        </div>
      </form>

      <h2 class="about-heading"><strong>Dodane nagrade</strong></h2>
      <div id="awardsList" class="award-list" aria-live="polite">
        <p class="admin-note">Ucitavanje nagrada...</p>
      </div>
    </div>

    <script defer src="/__/firebase/9.23.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="admin-nagrade.js?v=2"></script>
  </body>
</html>
