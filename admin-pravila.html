<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Admin - Pravila</title>
    <link rel="icon" type="image/png" href="Assets/favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=86" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <a href="admin.html" aria-label="Back to admin page">
      <img class="logo-corner logo-clickable" src="Assets/Logo.png" alt="Catan Liga Zagreb logo" />
    </a>
    <h1 class="page-title page-title-flow">Pravila</h1>
    <div class="page-content">
      <p class="admin-note">Dodaj PDF dokument s pravilima. Svaki dokument mora imati naziv i opis. Dokumenti se prikazuju igračima na stranici Pravila.</p>

      <form id="pravilaForm" class="admin-form" novalidate>
        <label class="form-field">
          <span class="form-label">Naziv dokumenta</span>
          <input id="pravilaNaziv" name="pravilaNaziv" type="text" required maxlength="120" placeholder="npr. Opća pravila igre" />
        </label>

        <label class="form-field">
          <span class="form-label">Opis</span>
          <textarea id="pravilaOpis" name="pravilaOpis" rows="4" maxlength="500" placeholder="Kratki opis sadržaja dokumenta..."></textarea>
          <small class="field-note">Limit: maksimalno 500 znakova.</small>
        </label>

        <label class="form-field">
          <span class="form-label">PDF dokument</span>
          <input id="pravilaPdf" name="pravilaPdf" type="file" accept="application/pdf" required />
          <small class="field-note">Maksimalna veličina datoteke: 20 MB.</small>
        </label>

        <p id="pravilaFormStatus" class="form-status" aria-live="polite"></p>

        <div class="page-cta-row page-cta-row-left">
          <button id="pravilaSubmitBtn" class="page-cta-btn" type="submit">Dodaj dokument</button>
          <button id="pravilaCancelEdit" class="page-cta-btn page-cta-btn-secondary" type="button" hidden>Odustani</button>
        </div>
      </form>

      <h2 class="about-heading"><strong>Dodani dokumenti</strong></h2>
      <div id="pravilaList" class="pravila-admin-list" aria-live="polite"></div>
    </div>
    <script defer src="/__/firebase/9.23.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="admin-env-config.js?v=1"></script>
    <script defer src="admin-auth.js?v=3"></script>
    <script defer src="admin-pravila.js?v=1"></script>
  </body>
</html>
