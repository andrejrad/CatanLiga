<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Prijava - Catan Liga Zagreb</title>
    <link rel="icon" type="image/png" href="Assets/favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=84" />
    <script defer src="/__/firebase/9.23.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="prijava.js?v=1"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <button class="back-btn" onclick="history.back()" aria-label="Natrag">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      Natrag
    </button>
    <a href="index.html" aria-label="Back to landing page">
      <img class="logo-corner logo-clickable" src="Assets/Logo.png" alt="Catan Liga Zagreb logo" />
    </a>
    <h1 class="page-title page-title-flow">Prijava</h1>
    <div class="page-content">
      <p class="admin-note">Ispuni formu za prijavu na turnir. Prijave su moguće samo za aktivne turnire.</p>

      <form id="registrationForm" class="admin-form" novalidate>
        <label class="form-field">
          <span class="form-label">Ime</span>
          <input id="registrationFirstName" name="firstName" type="text" autocomplete="given-name" required />
        </label>

        <label class="form-field">
          <span class="form-label">Prezime</span>
          <input id="registrationLastName" name="lastName" type="text" autocomplete="family-name" required />
        </label>

        <label class="form-field">
          <span class="form-label">Email</span>
          <input id="registrationEmail" name="email" type="email" autocomplete="email" required />
        </label>

        <label class="form-field">
          <span class="form-label">Odabir turnira</span>
          <select id="registrationTournament" name="tournament" required>
            <option value="">Učitavanje aktivnih turnira...</option>
          </select>
        </label>

        <label class="form-field">
          <span class="form-label">Napomena</span>
          <span class="field-note">Ako dolaziš s ekipom s kojom želiš igrati, navedi njihova puna imena - oni se također moraju prijaviti.</span>
          <textarea id="registrationNote" name="note" rows="4" maxlength="600"></textarea>
        </label>

        <fieldset class="checkbox-group registration-consent">
          <label>
            <input id="registrationConsent" name="consent" type="checkbox" required />
            Prihvaćam
            <a class="contact-link" href="uvjeti-koristenja.html">Pravila i Uvjete Korištenja</a>
            i
            <a class="contact-link" href="politika-privatnosti.html">Politiku Privatnosti</a>.
          </label>
        </fieldset>

        <p id="registrationFormStatus" class="form-status" aria-live="polite"></p>

        <div class="page-cta-row">
          <button id="registrationSubmitBtn" class="page-cta-btn" type="submit">Pošalji prijavu</button>
        </div>
      </form>
    </div>

    <div id="successPopup" class="popup-overlay" hidden>
      <div class="popup-box">
        <h2 class="popup-title">Catan Liga Zagreb</h2>
        <p class="popup-body">Prijava je uspješno zaprimljena. Veselimo se tvom dolasku na turnir!</p>
        <button class="popup-close" id="successPopupClose" aria-label="Zatvori">×</button>
      </div>
    </div>
  </body>
</html>
