    <script>
      (function() {
        var FIREBASE_WAIT_TRIES = 80;
        var FIREBASE_WAIT_MS = 125;
        var countdownDisplay = document.getElementById('countdownDisplay');
        var db = null;
        var tournamentsCollection = null;
        var countdownIntervalId = null;

        function formatCountdown(days, hours, minutes, seconds) {
          var pad = function(num) {
            return num < 10 ? '0' + num : String(num);
          };
          return pad(days) + ':' + pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
        }

        function updateCountdown() {
          if (!tournamentsCollection) {
            return;
          }

          tournamentsCollection
            .orderBy('date', 'asc')
            .get()
            .then(function(snapshot) {
              var now = new Date();
              var today = now.toISOString().split('T')[0];
              var nextTournament = null;

              snapshot.forEach(function(doc) {
                var tournament = doc.data();
                if (tournament.active !== false && tournament.date && tournament.time) {
                  if (!nextTournament || tournament.date > today || (tournament.date === today && tournament.time > now.toLocaleTimeString('sv-SE').substring(0, 5))) {
                    if (!nextTournament || tournament.date < nextTournament.date || (tournament.date === nextTournament.date && tournament.time < nextTournament.time)) {
                      nextTournament = tournament;
                    }
                  }
                }
              });

              if (nextTournament && nextTournament.date && nextTournament.time) {
                var tournamentDateTime = new Date(nextTournament.date + 'T' + nextTournament.time);
                var diff = tournamentDateTime - now;

                if (diff > 0) {
                  var days = Math.floor(diff / (1000 * 60 * 60 * 24));
                  var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                  var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                  var seconds = Math.floor((diff % (1000 * 60)) / 1000);

                  countdownDisplay.textContent = formatCountdown(days, hours, minutes, seconds);
                } else {
                  countdownDisplay.textContent = '00:00:00:00';
                }
              } else {
                countdownDisplay.textContent = '--:--:--:--';
              }
            })
            .catch(function(error) {
              console.error('Greška pri dohvačanju turnira:', error);
            });
        }

        function initFirebaseConnections() {
          if (!window.firebase || !firebase.apps || !firebase.apps.length) {
            return false;
          }

          db = firebase.firestore();
          tournamentsCollection = db.collection('tournaments');
          return true;
        }

        function waitForFirebaseAndSubscribe() {
          var tries = 0;
          var timer = setInterval(function() {
            tries++;

            if (initFirebaseConnections()) {
              clearInterval(timer);
              updateCountdown();
              if (countdownIntervalId) {
                clearInterval(countdownIntervalId);
              }
              countdownIntervalId = setInterval(updateCountdown, 1000);
              return;
            }

            if (tries >= FIREBASE_WAIT_TRIES) {
              clearInterval(timer);
              console.warn('Firebase se nije učitao u dozvoljenom vremenu.');
              countdownDisplay.textContent = 'Greška';
            }
          }, FIREBASE_WAIT_MS);
        }

        waitForFirebaseAndSubscribe();
      })();
    </script>
  </body>
</html>
