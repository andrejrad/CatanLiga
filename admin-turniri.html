<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Admin - Turniri</title>
    <link rel="icon" type="image/png" href="Assets/favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=83" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <a href="admin.html" aria-label="Back to admin page">
      <img class="logo-corner logo-clickable" src="Assets/Logo.png" alt="Catan Liga Zagreb logo" />
    </a>
    <h1 class="page-title page-title-flow">Turniri</h1>
    <div class="page-content">
      <p class="admin-note">Dodaj termin turnira odabirom datuma, venue partnera, vremena i kola.</p>

      <form id="tournamentForm" class="admin-form" novalidate>
        <label class="form-field">
          <span class="form-label">Datum</span>
          <input id="tournamentDate" name="tournamentDate" type="date" required />
        </label>

        <label class="form-field">
          <span class="form-label">Venue</span>
          <select id="tournamentVenue" name="tournamentVenue" required>
            <option value="">Učitavanje venue partnera...</option>
          </select>
        </label>

        <label class="form-field">
          <span class="form-label">Vrijeme</span>
          <input id="tournamentTime" name="tournamentTime" type="time" required />
        </label>

        <label class="form-field">
          <span class="form-label">Kolo</span>
          <input id="tournamentRound" name="tournamentRound" type="text" inputmode="text" placeholder="npr. 2 ili 2.a" required />
        </label>

        <label class="form-field">
          <span class="form-label">Zatvaranje prijava (sati prije početka)</span>
          <input id="tournamentRegistrationCloseHours" name="tournamentRegistrationCloseHours" type="number" min="0" step="1" value="0" required />
        </label>

        <label class="form-field">
          <span class="form-label">Maksimalni broj prijava (0 = neograničeno)</span>
          <input id="tournamentMaxCapacity" name="tournamentMaxCapacity" type="number" min="0" step="1" value="0" />
        </label>

        <label class="form-field">
          <span class="form-label">Status turnira</span>
          <select id="tournamentActive" name="tournamentActive" required>
            <option value="true">On</option>
            <option value="false">Off</option>
          </select>
        </label>

        <label class="form-field">
          <span class="form-label">Povezani turniri (opcionalno)</span>
          <select id="tournamentLinkedTournaments" name="tournamentLinkedTournaments" multiple size="5">
          </select>
          <span class="field-note">Ako igrač sudjeluje na više povezanih turnira, za ligu se računa samo njegov bolji rezultat.</span>
        </label>

        <p id="tournamentFormStatus" class="form-status" aria-live="polite"></p>

        <div class="page-cta-row page-cta-row-left">
          <button id="tournamentSubmitBtn" class="page-cta-btn" type="submit">Dodaj turnir</button>
          <button id="tournamentCancelEdit" class="page-cta-btn page-cta-btn-secondary" type="button" hidden>Odustani</button>
        </div>
      </form>

      <h2 class="about-heading"><strong>Popis turnira</strong></h2>
      <div class="partner-filters" aria-label="Filter turnira">
        <label class="form-field">
          <span class="form-label">Filtriraj po kolu</span>
          <select id="tournamentFilterRound">
            <option value="">Sva kola</option>
          </select>
        </label>

        <label class="form-field">
          <span class="form-label">Filtriraj po venue</span>
          <select id="tournamentFilterVenue">
            <option value="">Svi venue partneri</option>
          </select>
        </label>
      </div>
      <div id="tournamentList" class="tournament-list" aria-live="polite">
        <p class="admin-note">Učitavanje turnira...</p>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="tournamentDeleteConfirmModal" class="modal" style="display: none;">
      <div class="modal-content">
        <h2>Potvrda brisanja</h2>
        <p id="tournamentDeleteConfirmMessage"></p>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
          <button id="tournamentDeleteConfirmCancel" class="btn-secondary">Otkaži</button>
          <button id="tournamentDeleteConfirmYes" class="btn-danger">Obriši</button>
        </div>
      </div>
    </div>

    <script defer src="/__/firebase/9.23.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="admin-env-config.js?v=1"></script>
    <script defer src="admin-auth.js?v=3"></script>
    <script defer src="admin-turniri.js?v=16"></script>
  </body>
</html>
