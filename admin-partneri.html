<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Partneri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=79" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <a href="admin.html" aria-label="Back to admin page">
      <img class="logo-corner logo-clickable" src="Assets/Logo.png" alt="Catan Liga Zagreb logo" />
    </a>
    <h1 class="page-title page-title-flow">Partneri</h1>
    <div class="page-content">
      <p class="admin-note">Dodaj novog partnera kroz obrazac ispod. Logo datoteka može biti maksimalno 10MB.</p>

      <form id="partnerForm" class="admin-form" novalidate>
        <label class="form-field">
          <span class="form-label">Ime</span>
          <input id="partnerName" name="partnerName" type="text" required maxlength="120" />
        </label>

        <label class="form-field">
          <span class="form-label">Logo</span>
          <input id="partnerLogo" name="partnerLogo" type="file" accept="image/*" required />
        </label>

        <label class="form-field">
          <span class="form-label">Kontakt</span>
          <input id="partnerContact" name="partnerContact" type="text" maxlength="220" />
        </label>

        <label class="form-field">
          <span class="form-label">Web</span>
          <input id="partnerWeb" name="partnerWeb" type="text" maxlength="240" placeholder="npr. https://partner.com" />
        </label>

        <fieldset class="form-field checkbox-group">
          <legend class="form-label">Tip partnera</legend>
          <label><input type="checkbox" name="partnerType" value="nagrade" /> Nagrade</label>
          <label><input type="checkbox" name="partnerType" value="venue partner" /> Venue partner</label>
          <label><input type="checkbox" name="partnerType" value="board game partner" /> Board game partner</label>
          <label><input type="checkbox" name="partnerType" value="food & drink" /> Food & drink</label>
          <label><input type="checkbox" name="partnerType" value="experience" /> Experience</label>
          <label><input type="checkbox" name="partnerType" value="ostalo" /> Ostalo</label>
        </fieldset>

        <label class="form-field">
          <span class="form-label">Kratki opis</span>
          <textarea id="partnerDescription" name="partnerDescription" rows="4" maxlength="130"></textarea>
          <small class="field-note">Limit: maksimalno 130 znakova.</small>
        </label>

        <p id="partnerFormStatus" class="form-status" aria-live="polite"></p>

        <div class="page-cta-row page-cta-row-left">
          <button id="partnerSubmitBtn" class="page-cta-btn" type="submit">Dodaj partnera</button>
          <button id="partnerCancelEdit" class="page-cta-btn page-cta-btn-secondary" type="button" hidden>Odustani</button>
        </div>
      </form>

      <h2 class="about-heading"><strong>Dodani partneri</strong></h2>
      <div class="partner-filters" aria-label="Filter partnera">
        <label class="form-field">
          <span class="form-label">Filtriraj po tipu</span>
          <select id="partnerTypeFilter">
            <option value="">Svi tipovi</option>
            <option value="nagrade">Nagrade</option>
            <option value="venue partner">Venue partner</option>
            <option value="board game partner">Board game partner</option>
            <option value="food & drink">Food & drink</option>
            <option value="experience">Experience</option>
            <option value="ostalo">Ostalo</option>
          </select>
        </label>

        <label class="form-field">
          <span class="form-label">Pretraga po imenu</span>
          <input id="partnerNameSearch" type="text" placeholder="Upiši ime partnera..." />
        </label>
      </div>
      <div id="partnersList" class="partner-list" aria-live="polite"></div>
    </div>
    <script defer src="/__/firebase/9.23.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="admin-partneri.js?v=11"></script>
  </body>
</html>
