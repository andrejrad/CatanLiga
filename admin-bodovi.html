<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />    <title>Admin - Bodovanje</title>
    <link rel="icon" type="image/png" href="Assets/favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=83" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <a href="admin.html" aria-label="Back to admin page">
      <img class="logo-corner logo-clickable" src="Assets/Logo.png" alt="Catan Liga Zagreb logo" />
    </a>
    <h1 class="page-title page-title-flow">Bodovanje</h1>
    <div class="page-content">
      <p class="admin-note">Definiraj pravila bodovanja za ligu.</p>

      <form id="scoreRuleForm" class="admin-form" novalidate>
        <label class="form-field">
          <span class="form-label">Osvojeno mjesto</span>
          <input id="scoreRulePlace" type="number" min="1" step="1" required />
        </label>

        <label class="form-field">
          <span class="form-label">Bodovi za osvojeno mjesto</span>
          <input id="scoreRulePoints" type="number" min="0" step="1" required />
        </label>

        <div class="page-cta-row page-cta-row-left">
          <button id="scoreRuleSubmitBtn" class="page-cta-btn" type="submit">Dodaj pravilo</button>
        </div>
      </form>

      <h2 class="about-heading"><strong>Pravila bodova po mjestu</strong></h2>
      <p id="scoreRulesStatus" class="form-status" aria-live="polite"></p>
      <div id="scoreRulesList" class="tournament-list" aria-live="polite">
        <p class="admin-note">Učitavanje pravila...</p>
      </div>

      <h2 class="about-heading"><strong>Koeficijent bodova iz igre</strong></h2>
      <form id="scoreCoefForm" class="admin-form" novalidate>
        <label class="form-field">
          <span class="form-label">Koeficijent</span>
          <input id="scoreGameCoefficient" type="number" min="0" max="10" step="0.1" required />
        </label>

        <div class="page-cta-row page-cta-row-left">
          <button id="scoreCoefSubmitBtn" class="page-cta-btn" type="submit">Spremi koeficijent</button>
        </div>
      </form>

      <p id="scoreCoefStatus" class="form-status" aria-live="polite"></p>
    </div>

    <script defer src="/__/firebase/9.23.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="admin-auth.js?v=1"></script>
    <script defer src="admin-bodovi.js?v=1"></script>
  </body>
</html>
