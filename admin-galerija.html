<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Galerija</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=60" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <a href="admin.html" aria-label="Back to admin page">
      <img class="logo-corner logo-clickable" src="Assets/Logo.png" alt="Catan Liga Zagreb logo" />
    </a>
    <h1 class="page-title page-title-flow">Galerija</h1>
    <div class="page-content">
      <p class="admin-note">Odaberi turnir pa dodaj nove slike, pregledaj postojece i obrisi one koje vise ne trebaju.</p>

      <form id="galleryForm" class="admin-form" novalidate>
        <label class="form-field">
          <span class="form-label">Turnir</span>
          <select id="galleryTournament" required>
            <option value="">Ucitavanje turnira...</option>
          </select>
        </label>

        <label class="form-field">
          <span class="form-label">Nove slike</span>
          <input id="galleryImages" type="file" accept="image/*" multiple required />
          <small class="field-note">Mozes odabrati vise slika odjednom. Maksimalna velicina po slici je 10MB.</small>
        </label>

        <p id="galleryFormStatus" class="form-status" aria-live="polite"></p>

        <div class="page-cta-row page-cta-row-left">
          <button id="galleryUploadBtn" class="page-cta-btn" type="submit">Dodaj slike</button>
        </div>
      </form>

      <h2 class="about-heading"><strong>Slike turnira</strong></h2>
      <p id="gallerySelectedTournament" class="admin-note gallery-selected-tournament">Odaberi turnir za prikaz slika.</p>
      <div id="galleryList" class="admin-gallery-grid" aria-live="polite">
        <p class="admin-note">Ucitavanje...</p>
      </div>
    </div>

    <div id="galleryZoomOverlay" class="gallery-zoom-overlay" hidden>
      <div class="gallery-zoom-box" role="dialog" aria-modal="true" aria-label="Prikaz slike">
        <button id="galleryZoomClose" class="gallery-zoom-close" type="button" aria-label="Zatvori prikaz">×</button>
        <div class="gallery-zoom-toolbar">
          <button id="galleryZoomOut" class="partner-action-btn partner-action-btn-secondary" type="button" aria-label="Umanji">-</button>
          <button id="galleryZoomReset" class="partner-action-btn partner-action-btn-secondary" type="button" aria-label="Resetiraj zoom">100%</button>
          <button id="galleryZoomIn" class="partner-action-btn" type="button" aria-label="Uvecaj">+</button>
        </div>
        <div class="gallery-zoom-stage" id="galleryZoomStage">
          <img id="galleryZoomImage" class="gallery-zoom-image" alt="Uvecana slika turnira" />
        </div>
      </div>
    </div>

    <script defer src="/__/firebase/9.23.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-storage-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="admin-galerija.js?v=1"></script>
  </body>
</html>
