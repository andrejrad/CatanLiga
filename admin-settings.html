<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Admin - Settings</title>
    <link rel="icon" type="image/png" href="Assets/favicon.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=88" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <a href="admin.html" aria-label="Back to admin page">
      <img class="logo-corner logo-clickable" src="Assets/Logo.png" alt="Catan Liga Zagreb logo" />
    </a>
    <h1 class="page-title page-title-flow">Settings</h1>
    <div class="page-content">
      <p class="admin-note">Upravljanje prikazom carousel poruka na početnoj stranici korisnika.</p>

      <form id="adminSettingsForm" class="admin-form" novalidate>
        <label class="form-field" for="settingsCarouselToggle">
          <span class="form-label">Carousel na početnoj stranici</span>
          <div class="settings-switch-row">
            <span class="field-note" id="settingsCarouselHint">Učitavanje...</span>
            <span class="settings-switch">
              <input id="settingsCarouselToggle" type="checkbox" aria-label="Prikaži carousel" />
              <span id="settingsCarouselState">Off</span>
            </span>
          </div>
        </label>

        <p id="adminSettingsStatus" class="form-status" aria-live="polite"></p>

        <div class="page-cta-row page-cta-row-left">
          <button id="adminSettingsSaveBtn" class="page-cta-btn" type="submit">Spremi postavke</button>
        </div>
      </form>
    </div>

    <script defer src="/__/firebase/9.23.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="admin-env-config.js?v=1"></script>
    <script defer src="admin-auth.js?v=3"></script>
    <script defer src="admin-settings.js?v=1"></script>
  </body>
</html>
