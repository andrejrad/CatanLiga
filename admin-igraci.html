<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Igrači</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=81" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <a href="admin.html" aria-label="Back to admin page">
      <img class="logo-corner logo-clickable" src="Assets/Logo.png" alt="Catan Liga Zagreb logo" />
    </a>
    <h1 class="page-title page-title-flow">Igrači</h1>
    <div class="page-content">
      <p class="admin-note">Igrači preuzeti iz baze prijava, grupirani po emailu.</p>

      <div class="partner-filters" aria-label="Pretraži igrače">
        <label class="form-field">
          <span class="form-label">Pretraži po imenu, prezimenu ili emailu</span>
          <input id="igraciSearch" type="text" placeholder="npr. Ivan, Horvat ili email@domena.hr" />
        </label>
      </div>

      <p id="igraciStatus" class="form-status" aria-live="polite"></p>

      <div id="igraciList" class="tournament-list" aria-live="polite">
        <p class="admin-note">Učitavanje igrača...</p>
      </div>
    </div>

    <!-- Edit Player Modal -->
    <div id="editPlayerModal" class="modal" style="display: none;">
      <div class="modal-content">
        <h2>Uredi igrača</h2>
        <div class="form-field">
          <label class="form-label">Ime</label>
          <input id="editPlayerFirstName" type="text" />
        </div>
        <div class="form-field">
          <label class="form-label">Prezime</label>
          <input id="editPlayerLastName" type="text" />
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
          <button id="editPlayerCancel" class="btn-secondary">Otkaži</button>
          <button id="editPlayerSave" class="btn-primary">Spremi</button>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteConfirmModal" class="modal" style="display: none;">
      <div class="modal-content">
        <h2>Potvrda brisanja</h2>
        <p id="deleteConfirmMessage"></p>
        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
          <button id="deleteConfirmCancel" class="btn-secondary">Otkaži</button>
          <button id="deleteConfirmYes" class="btn-danger">Obriši</button>
        </div>
      </div>
    </div>

    <script defer src="/__/firebase/9.23.0/firebase-app-compat.js"></script>
    <script defer src="/__/firebase/9.23.0/firebase-firestore-compat.js"></script>
    <script defer src="/__/firebase/init.js"></script>
    <script defer src="admin-igraci.js?v=2"></script>
  </body>
</html>
